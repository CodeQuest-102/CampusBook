# Production profile overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# ProductionConfigGuard refuses to start if JWT_SECRET is the bundled default or
# CORS_ALLOWED_ORIGINS is a wildcard, so those MUST be set in the environment.

# Don't log every SQL statement in production.
spring.jpa.show-sql=false

# A production database is built by Flyway from V1 upward — never silently
# baseline a pre-existing, unknown schema.
spring.flyway.baseline-on-migrate=false

# API docs are a development aid; keep them off the public surface in prod.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
