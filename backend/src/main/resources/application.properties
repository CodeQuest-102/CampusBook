spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campusbook}
spring.datasource.username=${DB_USERNAME:campusbook_user}
spring.datasource.password=${DB_PASSWORD:yourpassword}

# Schema is owned by Flyway (src/main/resources/db/migration), not by Hibernate.
# `validate` makes the app refuse to start if the entities and the migrated
# schema have drifted apart — the drift ddl-auto=update used to hide silently.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# An existing dev database (created by the old ddl-auto=update) already has the
# V1 tables. baseline-on-migrate marks V1 as the starting point on such a
# database — so V1 is treated as already-applied and only V2+ run — while a
# fresh, empty database still runs V1 from scratch.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Render (and most PaaS hosts) inject the port to bind to via $PORT — that wins
# when set. Local dev has no PORT set, so it falls through to SERVER_PORT/8080.
server.port=${PORT:${SERVER_PORT:8080}}

# JWT — override JWT_SECRET in every non-dev environment (must be >= 32 bytes for HS384)
jwt.secret=${JWT_SECRET:campusbook-super-secret-key-change-this-later-12345678}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — comma-separated origins. Default covers local Expo (Metro / web).
# React Native's fetch doesn't enforce CORS, so this only affects browser targets.
# Set CORS_ALLOWED_ORIGINS to your real hosts in shared/prod environments; the
# prod profile refuses to start if this is left as "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# Password-reset email. Disabled by default: the reset code is logged to the
# console so the flow is demoable with no SMTP account. Set MAIL_ENABLED=true and
# the MAIL_* / spring.mail.* values to send real email.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:CampusBook <no-reply@campusbook.local>}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Paystack (institution subscription payments). Disabled by default: the upgrade
# screen falls back to a simulated payment so the flow is demoable with no keys.
# Set PAYSTACK_ENABLED=true and PAYSTACK_SECRET_KEY to a Paystack TEST secret key
# (sk_test_...) to take real test payments. The secret key stays server-side; the
# app never receives it. The callback URL is a sentinel the app intercepts in its
# checkout WebView — it needs no reachable page.
paystack.enabled=${PAYSTACK_ENABLED:false}
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:https://campusbook.dev/paystack/callback}
# Billing email fallback. The admin's own email is used when routable; Paystack
# rejects reserved domains (e.g. the demo admin's "@campusbook.local"), so those
# fall back to this address.
paystack.customer-email=${PAYSTACK_CUSTOMER_EMAIL:billing@campusbook.app}
