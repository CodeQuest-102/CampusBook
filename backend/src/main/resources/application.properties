spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campusbook}
spring.datasource.username=${DB_USERNAME:campusbook_user}
spring.datasource.password=${DB_PASSWORD:yourpassword}

# Schema is owned by Flyway (src/main/resources/db/migration), not by Hibernate.
# `validate` makes the app refuse to start if the entities and the migrated
# schema have drifted apart — the drift ddl-auto=update used to hide silently.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# An existing dev database (created by the old ddl-auto=update) already has the
# V1 tables. baseline-on-migrate marks V1 as the starting point on such a
# database — so V1 is treated as already-applied and only V2+ run — while a
# fresh, empty database still runs V1 from scratch.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=${SERVER_PORT:8080}

# JWT — override JWT_SECRET in every non-dev environment (must be >= 32 bytes for HS384)
jwt.secret=${JWT_SECRET:campusbook-super-secret-key-change-this-later-12345678}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — comma-separated origins; "*" (default) is dev-only, restrict in prod
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
