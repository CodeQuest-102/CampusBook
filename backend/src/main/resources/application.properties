spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campusbook_1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:campusbook}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}

# JWT — override JWT_SECRET in every non-dev environment (must be >= 32 bytes for HS384)
jwt.secret=${JWT_SECRET:campusbook-super-secret-key-change-this-later-12345678}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — comma-separated origins; "*" (default) is dev-only, restrict in prod
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
